[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-liveness"
version = "0.2.0"
description = "Per-second liveness detection for agent-triggered operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simon Mak" }]
keywords = ["watchdog", "liveness", "procfs", "opencode", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
jobstat = "liveness.cli:main"
liveness-daemon = "liveness.daemon:main"

[tool.setuptools.packages.find]
include = ["liveness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
